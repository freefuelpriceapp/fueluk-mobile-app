name: Publish OTA to Production

# Manually triggered workflow that publishes an EAS Update to the
# `production` branch. Use this when you want testers (and eventually
# real users on the closed-testing release) to pick up a JS-only fix
# without rebuilding/resubmitting the native AAB.
#
# Two triggers:
#   1. Manual: GitHub UI → Actions → "Publish OTA to Production" → Run workflow
#   2. Tag: push any tag matching `ota-prod-*` (e.g. `ota-prod-2026-06-19-maps`)

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Update message (shown in expo.dev Updates list)'
        required: true
        default: 'Production OTA'
  push:
    tags:
      - 'ota-prod-*'

concurrency:
  group: ota-production
  cancel-in-progress: false

jobs:
  publish:
    name: eas update --branch production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies (with retry on transient npm registry hiccups)
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt $attempt"
            if npm ci --no-audit --no-fund; then
              exit 0
            fi
            echo "npm ci failed; sleeping 15s before retry"
            sleep 15
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Publish EAS Update to production
        run: |
          MSG="${{ github.event.inputs.message }}"
          if [ -z "$MSG" ]; then
            MSG="OTA from tag ${{ github.ref_name }}"
          fi
          eas update --branch production --message "$MSG" --non-interactive
